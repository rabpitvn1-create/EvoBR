name: EvoBR Long Form CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: longform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, registries, regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  browser:
    name: Long Form browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: longform-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
