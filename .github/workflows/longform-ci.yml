name: EvoBR Long Form CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/import-storyforge-longform]

permissions:
  contents: read

concurrency:
  group: longform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, registries, regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  browser:
    name: Long Form browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-u11-level-screenshots
          path: test-results/u11-level-*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: longform-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  release_base:
    name: Reader P7 production-base and diff proof
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify P7 PR patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
      - run: npm ci
      - name: Build actual Pages subpath
        env:
          EVOBR_BASE_PATH: /EvoBR/
        run: npm run build
      - name: Validate emitted production assets
        run: node scripts/verify-reader-production-build.mjs dist /EvoBR/
